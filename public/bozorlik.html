<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bozorlik — Mondo Region</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Public+Sans:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="css/style.css">
<link rel="icon" href="assets/logo.png">
</head>
<body>
<div class="app-shell">
  <div class="sidebar" id="sidebar-root"></div>
  <div class="main">
    <div style="display:flex;align-items:baseline;justify-content:space-between;">
      <div class="page-title">Bozorlik kiritish</div>
      <div style="display:flex;align-items:center;gap:8px;" id="date-wrap">
        <span style="font-size:12px;color:var(--muted);">Sana:</span>
        <input type="date" id="date-input">
      </div>
    </div>
    <div class="page-sub">Postavshik: <b>Bozor (Закупка)</b> · Poster'dagi ingredientlar ro'yxatidan tanlanadi</div>

    <div style="display:flex;gap:24px;">
      <div style="flex:1.6;min-width:0;">
        <div class="card">
          <div id="rows"></div>
          <button type="button" class="btn-ghost" id="add-row" style="margin-top:14px;">+ Ingredient qo'shish</button>
          <div style="margin-top:6px;font-size:12px;color:var(--muted);">Ro'yxatda yo'q ingredient kerakmi? Admin/curator panelda Poster'dan sinxronlaydi yoki qo'lda qo'shadi.</div>

          <div style="margin-top:18px;">
            <label>Kommentariya</label>
            <textarea id="comment" rows="2" placeholder="Masalan: bozor narxi ko'tarilgani sababli..."></textarea>
          </div>

          <div id="validation-hint" class="error-box" style="display:none;"></div>

          <div style="display:flex;align-items:center;justify-content:space-between;margin-top:18px;padding-top:18px;border-top:1px solid var(--border);">
            <div>
              <div style="font-size:12px;color:var(--muted);">Jami summa</div>
              <div class="display" style="font-size:22px;font-weight:700;" id="total">0 so'm</div>
            </div>
            <div style="display:flex;gap:10px;">
              <button id="print-draft-btn" style="font-size:13px;">🖨️ Chop etish</button>
              <button class="btn-primary" id="submit-btn">Yuborish</button>
            </div>
          </div>
          <div id="err" class="error-box" style="display:none;"></div>
        </div>
      </div>

      <div style="flex:1;min-width:0;">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;">
          <div style="font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:16px;">Bozorliklar tarixi</div>
        </div>
        <div style="display:flex;align-items:center;gap:6px;margin-bottom:14px;">
          <span style="font-size:11.5px;color:var(--muted);">Dan</span>
          <input type="date" id="h-from">
          <span style="font-size:11.5px;color:var(--muted);">Gacha</span>
          <input type="date" id="h-to">
          <a id="export-link" href="#"><button style="font-size:11.5px;padding:6px 12px;">📊 Excel</button></a>
        </div>
        <div id="entries" style="max-height:560px;overflow:auto;"></div>
      </div>
    </div>
  </div>
</div>

<script src="js/api.js"></script>
<script src="js/nav.js"></script>
<script src="js/escpos.js"></script>
<script>
  let ingredients = [];
  let rowCount = 0;
  let currentUser = null;
  let entryDate = null;

  function rowTemplate(id) {
    return `
      <div class="bz-row" data-row="${id}" data-driver="price" style="display:grid;grid-template-columns:32% 14% 9% 19% 19% 4%;gap:8px;align-items:center;background:var(--paper);border-radius:10px;padding:9px 8px;margin-bottom:8px;position:relative;">
        <div style="position:relative;">
          <input type="text" class="ing-input" placeholder="Ingredient qidiring yoki tanlang" autocomplete="off">
          <input type="hidden" class="ing-id">
          <div class="ing-dropdown" style="display:none;position:absolute;top:calc(100% + 4px);left:0;right:0;background:#fff;border:1px solid var(--border);border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.1);z-index:30;max-height:220px;overflow:auto;"></div>
        </div>
        <input type="text" class="qty" placeholder="Miqdor">
        <div class="unit" style="font-size:13px;color:var(--muted);"></div>
        <input type="text" class="price" placeholder="Narx (so'm)">
        <input type="text" class="sum" placeholder="Summa (so'm)">
        <div style="text-align:center;color:#b0aea5;cursor:pointer;" class="remove-row">✕</div>
      </div>`;
  }

  function addRow() {
    rowCount += 1;
    const div = document.createElement('div');
    div.innerHTML = rowTemplate(rowCount);
    document.getElementById('rows').appendChild(div.firstElementChild);
    wireRow(document.querySelector(`.bz-row[data-row="${rowCount}"]`));
    validateAndTotal();
  }

  function highlightMatch(name, q) {
    if (!q) return name;
    const idx = name.toLowerCase().indexOf(q.toLowerCase());
    if (idx === -1) return name;
    return name.slice(0, idx) + `<span style="color:var(--purple);font-weight:700;">${name.slice(idx, idx + q.length)}</span>` + name.slice(idx + q.length);
  }

  // Ingredient qidiruv (autocomplete): yozgan sari ro'yxat toraya boradi
  // (nom ichida so'ralgan harflar bo'lsa yetarli), yoki bo'sh holda bosilsa
  // to'liq ro'yxat ochiladi. Tanlangan ingredient .ing-id ga yoziladi —
  // shu maydon bo'sh bo'lsa qator "to'liq emas" deb hisoblanadi.
  function renderIngDropdown(row, query) {
    const dropdown = row.querySelector('.ing-dropdown');
    const q = (query || '').trim().toLowerCase();
    const matches = q ? ingredients.filter((i) => i.name.toLowerCase().includes(q)) : ingredients;
    dropdown.innerHTML = matches.length
      ? matches.map((i) => `<div class="ing-option" data-id="${i.id}" data-name="${i.name}" data-unit="${i.unit}" style="padding:10px 12px;font-size:13px;cursor:pointer;border-bottom:1px solid #f0efe9;">${highlightMatch(i.name, q)}</div>`).join('')
      : `<div style="padding:10px 12px;font-size:12.5px;color:var(--muted);">Hech narsa topilmadi — admin/curator panelda qo'shing</div>`;
    dropdown.style.display = 'block';
    dropdown.querySelectorAll('.ing-option').forEach((opt) => {
      opt.addEventListener('mousedown', (e) => {
        e.preventDefault(); // input blur'dan oldin click ishlashi uchun
        selectIngredient(row, opt.dataset.id, opt.dataset.name, opt.dataset.unit);
      });
    });
  }

  function selectIngredient(row, id, name, unit) {
    row.querySelector('.ing-input').value = name;
    row.querySelector('.ing-id').value = id;
    row.querySelector('.unit').textContent = unit;
    row.querySelector('.ing-dropdown').style.display = 'none';
    row.querySelector('.qty').focus();
    validateAndTotal();
  }

  // Ikki tomonlama hisoblash: Narx kiritilsa -> Summa = Miqdor x Narx.
  // Summa kiritilsa -> Narx = Summa / Miqdor. Miqdor o'zgarganda esa, oxirgi
  // qo'lda kiritilgan maydon (driver) asosiy hisoblanib, ikkinchisi qayta hisoblanadi.
  function wireRow(row) {
    const ingInput = row.querySelector('.ing-input');
    const ingId = row.querySelector('.ing-id');
    const qty = row.querySelector('.qty');
    const price = row.querySelector('.price');
    const sum = row.querySelector('.sum');
    attachMoneyMask(price);
    attachMoneyMask(sum);

    const recalc = () => {
      const q = Number(qty.value) || 0;
      const driver = row.dataset.driver;
      if (driver === 'sum') {
        const s = moneyValue(sum);
        setMoneyValue(price, q > 0 ? Math.round(s / q) : 0);
      } else {
        const p = moneyValue(price);
        setMoneyValue(sum, q * p);
      }
    };

    ingInput.addEventListener('input', () => {
      ingId.value = ''; // qayta yozilsa, aniq tanlanmaguncha qator "to'liq emas" hisoblanadi
      renderIngDropdown(row, ingInput.value);
      validateAndTotal();
    });
    ingInput.addEventListener('focus', () => renderIngDropdown(row, ingInput.value));
    ingInput.addEventListener('blur', () => {
      setTimeout(() => {
        row.querySelector('.ing-dropdown').style.display = 'none';
        if (!ingId.value) {
          const exact = ingredients.find((i) => i.name.toLowerCase() === ingInput.value.trim().toLowerCase());
          if (exact) selectIngredient(row, exact.id, exact.name, exact.unit);
          else validateAndTotal();
        }
      }, 150);
    });

    qty.addEventListener('input', () => { recalc(); validateAndTotal(); });
    price.addEventListener('input', () => { row.dataset.driver = 'price'; recalc(); validateAndTotal(); });
    sum.addEventListener('input', () => { row.dataset.driver = 'sum'; recalc(); validateAndTotal(); });

    row.querySelector('.remove-row').addEventListener('click', () => { row.remove(); validateAndTotal(); });
  }

  // Qat'iy validatsiya: har bir qatorda ingredient+miqdor+narx to'liq bo'lmasa Yuborish bloklanadi.
  function validateAndTotal() {
    let total = 0;
    let allValid = true;
    let hasAnyRow = false;
    document.querySelectorAll('.bz-row').forEach((row) => {
      hasAnyRow = true;
      const ingIdVal = row.querySelector('.ing-id').value;
      const qty = Number(row.querySelector('.qty').value) || 0;
      const rowSum = moneyValue(row.querySelector('.sum'));
      const rowValid = ingIdVal && qty > 0;
      row.style.background = rowValid ? 'var(--paper)' : '#fdeceb';
      row.style.border = rowValid ? 'none' : '1px solid #f3c9c4';
      if (!rowValid) allValid = false;
      total += rowSum;
    });
    document.getElementById('total').textContent = `${fmtMoney(total)} so'm`;

    const hint = document.getElementById('validation-hint');
    const submitBtn = document.getElementById('submit-btn');
    if (!hasAnyRow || !allValid) {
      hint.style.display = 'block';
      hint.textContent = !hasAnyRow ? 'Kamida bitta ingredient qatori qo\'shing' : 'Barcha qatorlarda ingredient va miqdor to\'ldirilishi shart — Yuborish bloklangan';
      submitBtn.disabled = true;
    } else {
      hint.style.display = 'none';
      submitBtn.disabled = false;
    }
    return { valid: hasAnyRow && allValid, total };
  }

  function collectItems() {
    const items = [];
    document.querySelectorAll('.bz-row').forEach((row) => {
      const ingredient_id = Number(row.querySelector('.ing-id').value);
      const quantity = Number(row.querySelector('.qty').value);
      const unit_price = moneyValue(row.querySelector('.price'));
      if (ingredient_id && quantity > 0) items.push({ ingredient_id, quantity, unit_price: unit_price || 0 });
    });
    return items;
  }

  function statusPill(status) {
    if (status === 'posted') return '<span class="pill pill-green">Posterga kiritildi</span>';
    if (status === 'approved') return '<span class="pill pill-amber">Tasdiqlangan</span>';
    if (status === 'rejected') return '<span class="pill pill-gray">Rad etilgan</span>';
    return '<span class="pill pill-amber">Ko\'rib chiqilmoqda</span>';
  }

  async function loadEntries() {
    const from = document.getElementById('h-from').value;
    const to = document.getElementById('h-to').value;
    const { entries } = await api(`/bozorlik?from=${from}&to=${to}`);
    document.getElementById('export-link').href = `/api/bozorlik/export/xlsx?from=${from}&to=${to}`;
    const canApprove = currentUser.role === 'admin' || currentUser.role === 'curator';

    document.getElementById('entries').innerHTML = entries.length ? entries.map((e) => `
      <div class="card" style="margin-bottom:12px;${e.status === 'pending' && canApprove ? 'border:1.5px solid var(--purple);' : ''}">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;">
          <div style="font-size:13.5px;font-weight:600;">${e.business_date}</div>
          <div style="display:flex;align-items:center;gap:10px;">
            ${statusPill(e.status)}
            ${canApprove ? `<span class="btn-danger-text" data-delete="${e.id}" data-status="${e.status}" style="cursor:pointer;">O'chirish</span>` : ''}
          </div>
        </div>
        <div style="font-size:12.5px;color:var(--muted);margin-bottom:${e.items ? '10' : '2'}px;">${fmtMoney(e.total_amount)} so'm · ${e.created_by_name || ''}</div>
        ${e.items ? `
          <div style="font-size:10.5px;font-weight:700;color:var(--purple);text-transform:uppercase;letter-spacing:.04em;margin-bottom:6px;">Sotib olingan ingredientlar</div>
          <div style="display:flex;flex-direction:column;gap:4px;margin-bottom:10px;">
            ${e.items.map((it) => `<div style="display:flex;justify-content:space-between;font-size:12px;"><span>${it.ingredient_name} — ${it.quantity} ${it.unit} × ${fmtMoney(it.unit_price)}</span><span style="font-weight:600;">${fmtMoney(it.sum)}</span></div>`).join('')}
          </div>` : ''}
        ${canApprove && e.status === 'pending' ? `
          <div style="display:flex;gap:8px;">
            <button data-approve="${e.id}" style="flex:1;font-size:12px;padding:8px;">Tasdiqlash</button>
            <button data-reject="${e.id}" style="flex:1;font-size:12px;padding:8px;border-color:#f3c9c4;color:var(--red-fg);">Rad etish</button>
          </div>` : ''}
        ${canApprove && e.status === 'approved' ? `<button class="btn-primary" data-post="${e.id}" style="font-size:12px;padding:8px 12px;width:100%;">Posterga kiritish</button>` : ''}
        ${canApprove && e.status === 'posted' ? `<button data-print="${e.id}" style="font-size:12px;padding:8px 12px;width:100%;">🖨️ Chekni chop etish</button>` : ''}
      </div>`).join('') : '<div class="empty">Hali bozorlik yozuvlari yo\'q</div>';

    document.querySelectorAll('[data-approve]').forEach((btn) => btn.addEventListener('click', async () => {
      await api(`/bozorlik/${btn.dataset.approve}/approve`, { method: 'POST' });
      loadEntries();
    }));
    document.querySelectorAll('[data-reject]').forEach((btn) => btn.addEventListener('click', async () => {
      if (!confirm("Bu bozorlikni rad etishga ishonchingiz komilmi?")) return;
      await api(`/bozorlik/${btn.dataset.reject}/reject`, { method: 'POST' });
      loadEntries();
    }));
    document.querySelectorAll('[data-post]').forEach((btn) => btn.addEventListener('click', async () => {
      try { await api(`/bozorlik/${btn.dataset.post}/post-to-poster`, { method: 'POST' }); loadEntries(); }
      catch (e) { alert(e.message); }
    }));
    document.querySelectorAll('[data-print]').forEach((btn) => btn.addEventListener('click', async () => {
      const { entry, items } = await api(`/bozorlik/${btn.dataset.print}`);
      await printBozorlikReceipt(entry, items, null);
    }));
    document.querySelectorAll('[data-delete]').forEach((btn) => btn.addEventListener('click', async () => {
      const isPosted = btn.dataset.status === 'posted';
      const msg = isPosted
        ? "Bu bozorlik allaqachon Poster'ga kiritilgan — bizning tizimdan o'chiriladi, lekin Poster'dagi yozuv o'zi o'chmaydi. Davom etilsinmi?"
        : "Bu bozorlikni butunlay o'chirishga ishonchingiz komilmi?";
      if (!confirm(msg)) return;
      try { await api(`/bozorlik/${btn.dataset.delete}`, { method: 'DELETE' }); loadEntries(); }
      catch (e) { alert(e.message); }
    }));
  }

  (async () => {
    currentUser = await bootPage();
    if (!currentUser) return;
    const isAdminOrCurator = currentUser.role === 'admin' || currentUser.role === 'curator';

    const today = await api('/dashboard/summary').then((s) => s.business_date);
    entryDate = today;
    document.getElementById('date-input').value = today;
    document.getElementById('date-wrap').style.display = isAdminOrCurator ? 'flex' : 'none';
    document.getElementById('date-input').addEventListener('change', (e) => { entryDate = e.target.value; });

    document.getElementById('h-to').value = today;
    document.getElementById('h-from').value = new Date(Date.now() - 6 * 86400000).toISOString().slice(0, 10);
    document.getElementById('h-from').addEventListener('change', loadEntries);
    document.getElementById('h-to').addEventListener('change', loadEntries);

    const ingRes = await api('/admin/ingredients').catch(() => ({ ingredients: [] }));
    ingredients = ingRes.ingredients || [];
    if (ingredients.length === 0) {
      document.getElementById('rows').innerHTML = '<div class="empty">Hali ingredientlar qo\'shilmagan — admin panelda qo\'shing</div>';
      document.getElementById('add-row').disabled = true;
    } else {
      addRow();
    }
    document.getElementById('add-row').addEventListener('click', addRow);

    document.getElementById('print-draft-btn').addEventListener('click', async () => {
      const items = collectItems().map((it) => {
        const ing = ingredients.find((i) => i.id === it.ingredient_id);
        return { ingredient_name: ing?.name || '', unit: ing?.unit || '', unit_price: it.unit_price, quantity: it.quantity, sum: it.quantity * it.unit_price };
      });
      const total = items.reduce((s, it) => s + it.sum, 0);
      await printBozorlikReceipt({ business_date: entryDate, total_amount: total }, items, null);
    });

    document.getElementById('submit-btn').addEventListener('click', async () => {
      const { valid } = validateAndTotal();
      const errBox = document.getElementById('err');
      errBox.style.display = 'none';
      if (!valid) return;
      try {
        await api('/bozorlik', { method: 'POST', body: { items: collectItems(), comment: document.getElementById('comment').value, business_date: entryDate } });
        document.getElementById('rows').innerHTML = '';
        rowCount = 0;
        addRow();
        document.getElementById('comment').value = '';
        loadEntries();
      } catch (e) {
        errBox.textContent = e.message;
        errBox.style.display = 'block';
      }
    });

    loadEntries();
  })();
</script>
</body>
</html>
