<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kunlik savdo — KPI Bonus</title>
<script>(function(){var t=localStorage.getItem('kpi_theme')||'dark';document.documentElement.setAttribute('data-theme',t);})();</script>
<link rel="stylesheet" href="/css/style.css">
<style>
  .multiselect { position: relative; }
  .ms-box {
    min-width: 240px;
    min-height: 40px;
    background: var(--input-bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 6px 8px;
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    align-items: center;
    cursor: pointer;
  }
  .ms-chip {
    background: rgba(245,197,24,0.15);
    color: var(--accent);
    border: 1px solid var(--accent-dark);
    border-radius: 999px;
    padding: 3px 8px 3px 12px;
    font-size: 12px;
    display: flex;
    align-items: center;
    gap: 6px;
    white-space: nowrap;
  }
  .ms-chip .x { cursor:pointer; opacity:0.7; font-weight:700; }
  .ms-chip .x:hover { opacity:1; color: var(--danger); }
  .ms-placeholder { color: var(--text-dim); font-size: 13px; }
  .ms-dropdown {
    position: absolute;
    top: calc(100% + 4px);
    left: 0;
    width: 280px;
    max-height: 280px;
    overflow-y: auto;
    background: var(--card);
    border: 1px solid var(--border-strong);
    border-radius: 8px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.4);
    z-index: 20;
    padding: 6px;
    display: none;
  }
  .ms-dropdown.open { display: block; }
  .ms-option {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 7px 10px;
    border-radius: 6px;
    font-size: 13px;
    cursor: pointer;
  }
  .ms-option:hover { background: var(--card-hover); }
  .ms-option input { margin: 0; }
</style>
</head>
<body>
  <div class="container">
    <div class="filters">
      <div class="field">
        <label for="date_from">Sanadan</label>
        <input type="date" id="date_from">
      </div>
      <div class="field">
        <label for="date_to">Sanagacha</label>
        <input type="date" id="date_to">
      </div>
      <div class="field">
        <label for="spot_id">Filial</label>
        <select id="spot_id">
          <option value="">Barchasi</option>
        </select>
      </div>
      <div class="field multiselect">
        <label>Mahsulot kategoriyasi</label>
        <div class="ms-box" id="ms-box">
          <span class="ms-placeholder" id="ms-placeholder">Barchasi</span>
        </div>
        <div class="ms-dropdown" id="ms-dropdown"></div>
      </div>
      <button class="btn-primary apply-btn" id="apply-btn" style="max-width:140px;">Qo'llash</button>
    </div>

    <div class="section" id="matrix-section">
      <h2 style="margin-top:0;">Kunlik savdo — <span id="matrix-period"></span></h2>
      <p class="journal-sub">Har bir filial bo'yicha, har bir kategoriyadan qancha sotilgani (dona/kg). Bonus bu yerda hisobga olinmaydi.</p>
      <div style="overflow-x:auto;">
        <table id="matrix-table">
          <thead><tr id="matrix-head"></tr></thead>
          <tbody id="matrix-body"></tbody>
        </table>
      </div>
      <div class="empty-state" id="matrix-empty" style="display:none;">Bu davr uchun ma'lumot yo'q</div>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/topbar.js"></script>
  <script src="/js/categoryOrder.js"></script>
  <script>
    requireSection('daily_sales');
    renderTopbar('sales');

    let spotsById = {};
    let tiersConfig = {};
    let selectedCategories = []; // bo'sh massiv = "Barchasi"

    function setDefaultDates() {
      const today = todayStr();
      document.getElementById('date_from').value = today;
      document.getElementById('date_to').value = today;
    }

    async function loadTiersConfig() {
      try {
        const data = await apiFetch('/bonus/tiers');
        tiersConfig = data.categories;
      } catch (e) {
        showToast('Pog\'ona jadvalini yuklab bo\'lmadi: ' + e.message, true);
      }
    }

    async function loadSpots() {
      try {
        const data = await apiFetch('/spots');
        const select = document.getElementById('spot_id');
        data.spots.forEach((s) => {
          spotsById[s.spot_id] = s.name;
          const opt = document.createElement('option');
          opt.value = s.spot_id;
          opt.textContent = s.name;
          select.appendChild(opt);
        });
      } catch (e) {
        showToast('Filiallarni yuklab bo\'lmadi: ' + e.message, true);
      }
    }

    // --- Ko'p tanlovli kategoriya (multi-select "chip") ---
    function renderMsChips() {
      const box = document.getElementById('ms-box');
      if (!selectedCategories.length) {
        box.innerHTML = '<span class="ms-placeholder">Barchasi</span>';
        return;
      }
      box.innerHTML = selectedCategories.map((c) => `
        <span class="ms-chip" data-cat="${c}">${c} <span class="x" data-remove="${c}">&times;</span></span>
      `).join('');
      box.querySelectorAll('.x').forEach((x) => {
        x.addEventListener('click', (e) => {
          e.stopPropagation();
          selectedCategories = selectedCategories.filter((c) => c !== x.dataset.remove);
          renderMsChips();
          renderMsDropdown();
        });
      });
    }

    function renderMsDropdown() {
      const dropdown = document.getElementById('ms-dropdown');
      dropdown.innerHTML = CATEGORY_ORDER.map((c) => `
        <label class="ms-option">
          <input type="checkbox" value="${c}" ${selectedCategories.includes(c) ? 'checked' : ''}>
          ${c}
        </label>
      `).join('');
      dropdown.querySelectorAll('input').forEach((cb) => {
        cb.addEventListener('change', () => {
          if (cb.checked) {
            selectedCategories.push(cb.value);
          } else {
            selectedCategories = selectedCategories.filter((c) => c !== cb.value);
          }
          renderMsChips();
        });
      });
    }

    document.getElementById('ms-box').addEventListener('click', () => {
      document.getElementById('ms-dropdown').classList.toggle('open');
    });
    document.addEventListener('click', (e) => {
      if (!e.target.closest('.multiselect')) {
        document.getElementById('ms-dropdown').classList.remove('open');
      }
    });

    // Filial vertikal (qatorlar), kategoriya gorizontal (ustunlar). Davr bo'yicha
    // miqdorlar yig'ib (summalab) ko'rsatiladi - bitta kun ham, bir necha kun ham bo'lishi mumkin.
    async function loadMatrix() {
      const date_from = document.getElementById('date_from').value;
      const date_to = document.getElementById('date_to').value;
      const spot_id = document.getElementById('spot_id').value;

      const params = new URLSearchParams({ date_from, date_to });
      if (spot_id) params.set('spot_id', spot_id);
      if (selectedCategories.length) params.set('categories', selectedCategories.join(','));

      try {
        const data = await apiFetch('/bonus?' + params.toString());

        document.getElementById('matrix-period').textContent =
          date_from === date_to ? date_from : `${date_from} — ${date_to}`;

        // Ustunlar: agar kategoriya(lar) tanlangan bo'lsa faqat o'shalar, aks holda
        // belgilangan tartibda hammasini ko'rsatamiz.
        const allCats = sortByCategoryOrder(Object.keys(tiersConfig));
        const categories = selectedCategories.length
          ? sortByCategoryOrder(selectedCategories)
          : allCats;

        // Qatorlar: agar filial tanlangan bo'lsa faqat o'shani, aks holda
        // foydalanuvchi ko'ra oladigan barcha filiallarni.
        const allSpotOptions = Array.from(document.getElementById('spot_id').options)
          .filter((o) => o.value !== '')
          .map((o) => Number(o.value));
        const spotIds = spot_id ? [Number(spot_id)] : allSpotOptions;

        const emptyEl = document.getElementById('matrix-empty');
        if (!spotIds.length) {
          document.getElementById('matrix-head').innerHTML = '';
          document.getElementById('matrix-body').innerHTML = '';
          emptyEl.style.display = 'block';
          return;
        }
        emptyEl.style.display = 'none';

        // spot_id + category -> davr bo'yicha yig'ilgan miqdor
        const qtyMap = new Map();
        data.rows.forEach((r) => {
          const key = `${r.spot_id}::${r.category}`;
          qtyMap.set(key, (qtyMap.get(key) || 0) + r.quantity);
        });

        const head = document.getElementById('matrix-head');
        head.innerHTML = '<th>Filial</th>' + categories.map((c) => {
          const cfg = tiersConfig[c];
          const unit = cfg && cfg.unit === 'kg' ? ' (kg)' : '';
          return `<th>${c}${unit}</th>`;
        }).join('');

        const body = document.getElementById('matrix-body');
        body.innerHTML = spotIds.map((sId) => {
          const cells = categories.map((c) => {
            const qty = qtyMap.get(`${sId}::${c}`);
            const display = qty ? (Math.round(qty * 100) / 100) : '—';
            return `<td>${display}</td>`;
          }).join('');
          return `<tr><td><b>${spotsById[sId] || ('#' + sId)}</b></td>${cells}</tr>`;
        }).join('');
      } catch (e) {
        showToast('Ma\'lumot yuklashda xato: ' + e.message, true);
      }
    }

    document.getElementById('apply-btn').addEventListener('click', loadMatrix);

    (async function init() {
      setDefaultDates();
      renderMsChips();
      renderMsDropdown();
      await loadTiersConfig();
      await loadSpots();
      await loadMatrix();
    })();
  </script>
</body>
</html>
