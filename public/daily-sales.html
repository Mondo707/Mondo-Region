<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kunlik savdo — Mondo Region</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Public+Sans:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="css/style.css">
<link rel="icon" href="assets/logo.png">
</head>
<body>
<div class="app-shell">
  <div class="sidebar" id="sidebar-root"></div>
  <div class="main">
    <div style="display:flex;align-items:baseline;justify-content:space-between;">
      <div class="page-title">Kunlik savdo</div>
      <div style="display:flex;align-items:center;gap:8px;">
        <span style="font-size:11.5px;color:var(--muted);">Dan</span>
        <input type="date" id="ds-from">
        <span style="font-size:11.5px;color:var(--muted);">Gacha</span>
        <input type="date" id="ds-to">
        <a id="ds-export" href="#"><button style="font-size:11.5px;padding:7px 12px;">📊 Excel</button></a>
      </div>
    </div>
    <div class="page-sub">Kategoriyalar bo'yicha sotilgan miqdor (dona)</div>

    <div style="display:flex;gap:24px;align-items:flex-start;">
      <div style="flex:1.5;">
        <div id="chips" style="display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap;"></div>
        <div class="card" style="padding:0;overflow:auto;">
          <table id="sales-table"></table>
        </div>
        <div style="margin-top:10px;font-size:12px;color:var(--muted);">Har bir chekdagi mahsulot sonlari kategoriya bo'yicha yig'ilib, kunlik dona ko'rinishida ko'rsatiladi.</div>
      </div>

      <div id="mgmt-col" style="flex:1;display:none;">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;">
          <div style="font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:16px;">Kategoriyalarni boshqarish</div>
          <span class="badge badge-ac" style="position:static;">Curator huquqi</span>
        </div>
        <div class="card" style="margin-bottom:14px;">
          <div id="cat-list" style="display:flex;flex-direction:column;gap:6px;"></div>
          <div style="display:flex;gap:8px;margin-top:12px;">
            <input type="text" id="new-cat-name" placeholder="Yangi kategoriya nomi">
            <button class="btn" id="add-cat">Qo'shish</button>
          </div>
        </div>

        <div class="card">
          <div style="font-size:13px;font-weight:700;margin-bottom:10px;">Mahsulotni kategoriyaga bog'lash</div>
          <div id="unmapped-list"></div>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="js/api.js"></script>
<script src="js/nav.js"></script>
<script>
  let allCategories = [];
  let selectedIds = [];

  async function loadTable() {
    const from = document.getElementById('ds-from').value;
    const to = document.getElementById('ds-to').value;
    const catQ = selectedIds.length ? `&category_ids=${selectedIds.join(',')}` : '';
    const q = `?from=${from}&to=${to}${catQ}`;
    const { categories, selected_categories, table } = await api(`/daily-sales${q}`);
    allCategories = categories;
    if (!selectedIds.length) selectedIds = selected_categories.map((c) => c.id);
    document.getElementById('ds-export').href = `/api/daily-sales/export/xlsx${q}`;
    renderChips();

    const head = `<thead><tr><th>Sana</th>${selected_categories.map((c) => `<th>${c.name} (dona)</th>`).join('')}<th>Jami (dona)</th></tr></thead>`;
    const body = `<tbody>${table.map((row) => `
      <tr><td>${row.business_date}</td>${selected_categories.map((c) => `<td>${row[c.id] || 0}</td>`).join('')}<td style="font-weight:700;">${row.total_quantity}</td></tr>
    `).join('') || '<tr><td class="empty" colspan="10">Hali ma\'lumot yo\'q</td></tr>'}</tbody>`;
    document.getElementById('sales-table').innerHTML = head + body;
  }

  function renderChips() {
    document.getElementById('chips').innerHTML = allCategories.map((c) => `
      <div class="chip ${selectedIds.includes(c.id) ? 'selected' : ''}" data-id="${c.id}">${c.name} ${selectedIds.includes(c.id) ? '✕' : ''}</div>
    `).join('');
    document.querySelectorAll('.chip').forEach((chip) => chip.addEventListener('click', () => {
      const id = Number(chip.dataset.id);
      selectedIds = selectedIds.includes(id) ? selectedIds.filter((x) => x !== id) : [...selectedIds, id];
      loadTable();
    }));
  }

  async function loadMgmt() {
    function drawCatList() {
      document.getElementById('cat-list').innerHTML = allCategories.map((c) => `
        <div id="dsc-row-${c.id}" style="display:flex;align-items:center;justify-content:space-between;padding:8px 10px;border-radius:8px;background:var(--paper);">
          <span style="font-size:13px;">${c.name}</span>
          <span><span class="btn-link" data-edit-cat="${c.id}">Tahrirlash</span> · <span class="btn-danger-text" data-del-cat="${c.id}" style="cursor:pointer;">O'chirish</span></span>
        </div>`).join('');
      document.querySelectorAll('[data-del-cat]').forEach((el) => el.addEventListener('click', async () => {
        if (!confirm("O'chirilsinmi?")) return;
        await api(`/admin/categories/${el.dataset.delCat}`, { method: 'DELETE' });
        const { categories } = await api('/daily-sales?from=' + document.getElementById('ds-from').value + '&to=' + document.getElementById('ds-to').value);
        allCategories = categories;
        loadMgmt();
        loadTable();
      }));
      document.querySelectorAll('[data-edit-cat]').forEach((el) => el.addEventListener('click', () => {
        const c = allCategories.find((x) => x.id === Number(el.dataset.editCat));
        document.getElementById(`dsc-row-${c.id}`).innerHTML = `
          <input type="text" class="dsc-edit-name" value="${c.name}" style="flex:1;margin-right:8px;">
          <span><span class="btn-link" data-save-cat="${c.id}">Saqlash</span> · <span class="btn-link" data-cancel-cat="${c.id}">Bekor</span></span>`;
        document.querySelector(`[data-save-cat="${c.id}"]`).addEventListener('click', async () => {
          const name = document.querySelector(`#dsc-row-${c.id} .dsc-edit-name`).value.trim();
          if (!name) return;
          await api(`/admin/categories/${c.id}`, { method: 'PUT', body: { name } });
          const { categories } = await api('/daily-sales?from=' + document.getElementById('ds-from').value + '&to=' + document.getElementById('ds-to').value);
          allCategories = categories;
          loadMgmt();
          loadTable();
        });
        document.querySelector(`[data-cancel-cat="${c.id}"]`).addEventListener('click', drawCatList);
      }));
    }
    drawCatList();

    try {
      const { products } = await api('/admin/categories/unmapped-products');
      document.getElementById('unmapped-list').innerHTML = products.length ? products.map((p) => `
        <div style="display:flex;align-items:center;justify-content:space-between;padding:9px 0;border-bottom:1px solid #efeee8;">
          <span style="font-size:13px;">${p.product_name}</span>
          <select class="map-select" data-pid="${p.product_id}" data-pname="${p.product_name}">
            <option value="">Kategoriya tanlang</option>
            ${allCategories.map((c) => `<option value="${c.id}">${c.name}</option>`).join('')}
          </select>
        </div>`).join('') : '<div class="empty">Barcha mahsulotlar bog\'langan</div>';
      document.querySelectorAll('.map-select').forEach((sel) => sel.addEventListener('change', async () => {
        if (!sel.value) return;
        await api('/admin/categories/map-product', { method: 'POST', body: { poster_product_id: sel.dataset.pid, product_name: sel.dataset.pname, category_id: Number(sel.value) } });
        loadMgmt();
      }));
    } catch (e) { /* Poster mavjud bo'lmasa jim o'tkaziladi */ }
  }

  (async () => {
    const user = await bootPage();
    if (!user) return;
    const today = await api('/dashboard/summary').then((s) => s.business_date);
    document.getElementById('ds-to').value = today;
    document.getElementById('ds-from').value = new Date(Date.now() - 6 * 86400000).toISOString().slice(0, 10);
    document.getElementById('ds-from').addEventListener('change', loadTable);
    document.getElementById('ds-to').addEventListener('change', loadTable);

    await loadTable();

    const canManage = user.role === 'admin' || user.role === 'curator';
    if (canManage) {
      document.getElementById('mgmt-col').style.display = 'block';
      loadMgmt();
      document.getElementById('add-cat').addEventListener('click', async () => {
        const input = document.getElementById('new-cat-name');
        if (!input.value.trim()) return;
        await api('/admin/categories', { method: 'POST', body: { name: input.value.trim() } });
        input.value = '';
        const { categories } = await api('/daily-sales?from=' + document.getElementById('ds-from').value + '&to=' + document.getElementById('ds-to').value);
        allCategories = categories;
        loadMgmt();
      });
    }
  })();
</script>
</body>
</html>
