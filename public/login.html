<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kirish — Mondo Region</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Public+Sans:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="css/style.css">
<link rel="icon" href="assets/logo.png">
</head>
<body>
  <div class="login-wrap">
    <div class="login-left">
      <div style="display:flex;align-items:center;gap:12px;">
        <img src="assets/logo.png" alt="Mondo" style="width:40px;height:40px;border-radius:10px;object-fit:cover;">
        <div class="display" style="font-weight:700;font-size:20px;letter-spacing:.3px;">MONDO REGION</div>
      </div>
      <div style="max-width:520px;">
        <div class="display" style="font-weight:600;font-size:40px;line-height:1.15;margin-bottom:20px;">Viloyat filiallari uchun boshqaruv tizimi</div>
        <div style="font-size:16px;line-height:1.6;color:#b8b6ac;">Bozorlik, xarajatlar, kassa va FOT — bittа joyda, Poster POS bilan bevosita ulangan holda.</div>
      </div>
      <div style="font-size:13px;color:#6b6a76;">© 2026 Mondo Region</div>
    </div>
    <div class="login-right">
      <div class="display" style="font-weight:600;font-size:24px;margin-bottom:8px;">Tizimga kirish</div>
      <div style="font-size:14px;color:#6b6a63;margin-bottom:28px;">Login va parolingizni kiriting</div>
      <form id="login-form">
        <label for="username">Login</label>
        <input type="text" id="username" autocomplete="username" required style="margin-bottom:16px;">
        <label for="password">Parol</label>
        <input type="password" id="password" autocomplete="current-password" required style="margin-bottom:22px;">
        <button type="submit" class="btn-primary" style="width:100%;padding:13px;">Kirish</button>
        <div id="err" class="error-box" style="display:none;"></div>
      </form>
      <div style="margin-top:22px;padding-top:22px;border-top:1px solid var(--border);font-size:12.5px;color:var(--muted);">
        Muammo bo'lsa filial menejeriga yoki adminga murojaat qiling.
      </div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script>
    (async () => {
      const { user } = await api('/auth/me');
      if (user) window.location.href = '/dashboard.html';
    })();

    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const errBox = document.getElementById('err');
      errBox.style.display = 'none';
      try {
        await api('/auth/login', {
          method: 'POST',
          body: { username: document.getElementById('username').value.trim(), password: document.getElementById('password').value },
        });
        window.location.href = '/dashboard.html';
      } catch (e2) {
        errBox.textContent = e2.message;
        errBox.style.display = 'block';
      }
    });
  </script>
</body>
</html>
