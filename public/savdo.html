<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script>(function(){var t=localStorage.getItem('kpi_theme')||'dark';document.documentElement.setAttribute('data-theme',t);})();</script>
<link rel="stylesheet" href="/css/style.css">
<title>Savdo — KPI Bonus</title>
<style>
  .sv-chart-wrap { width: 100%; overflow-x: auto; }
  .sv-chart-wrap svg text { fill: var(--text-dim); font-size: 10px; }
  .sv-trend { font-size: 11.5px; margin-top: 4px; }
  .sv-trend.up { color: var(--success); }
  .sv-trend.down { color: var(--danger); }
</style>
</head>
<body>
  <div class="container">
    <div class="filters">
      <div class="field">
        <label for="spot_id">Filial</label>
        <select id="spot_id"><option value="">Barchasi</option></select>
      </div>
      <div class="field">
        <label for="date_from">Sanadan</label>
        <input type="date" id="date_from">
      </div>
      <div class="field">
        <label for="date_to">Sanagacha</label>
        <input type="date" id="date_to">
      </div>
      <button class="btn-primary apply-btn" id="apply-btn" style="max-width:140px;">Qo'llash</button>
    </div>

    <div class="summary-cards">
      <div class="summary-card total">
        <div class="label">Jami savdo (davr)</div>
        <div class="value" id="sv-total">0 so'm</div>
      </div>
      <div class="summary-card">
        <div class="label">O'rtacha kunlik savdo</div>
        <div class="value" id="sv-average">0 so'm</div>
        <div class="sv-trend" id="sv-trend"></div>
      </div>
      <div class="summary-card">
        <div class="label">Eng yuqori kun</div>
        <div class="value" id="sv-max">—</div>
        <div class="sv-trend" style="color:var(--text-dim);" id="sv-max-date"></div>
      </div>
      <div class="summary-card">
        <div class="label">Eng past kun</div>
        <div class="value" id="sv-min">—</div>
        <div class="sv-trend" style="color:var(--text-dim);" id="sv-min-date"></div>
      </div>
    </div>

    <div class="section">
      <h2 style="margin-top:0;">Kunlik savdo dinamikasi</h2>
      <div class="sv-chart-wrap" id="sv-chart"></div>
      <div class="empty-state" id="sv-chart-empty" style="display:none;">Bu davr uchun ma'lumot yo'q</div>
    </div>

    <div class="section">
      <h2 style="margin-top:0;">Savdo jurnali</h2>
      <table>
        <thead><tr><th>Sana</th><th>Umumiy kassa</th></tr></thead>
        <tbody id="sv-journal-body"></tbody>
      </table>
      <div class="empty-state" id="sv-journal-empty" style="display:none;">Bu davr uchun ma'lumot yo'q</div>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/topbar.js"></script>
  <script>
    requireSection('savdo');
    renderTopbar('savdo');

    let spotsById = {};

    async function loadSpots() {
      try {
        const data = await apiFetch('/spots');
        const select = document.getElementById('spot_id');
        data.spots.forEach((s) => {
          spotsById[s.spot_id] = s.name;
          const opt = document.createElement('option');
          opt.value = s.spot_id;
          opt.textContent = s.name;
          select.appendChild(opt);
        });
      } catch (e) {
        showToast('Filiallarni yuklab bo\'lmadi: ' + e.message, true);
      }
    }

    function fmtShortDate(dateStr) {
      const [y, m, d] = dateStr.split('-');
      const months = ['yan','fev','mar','apr','may','iyun','iyul','avg','sen','okt','noy','dek'];
      return `${Number(d)}-${months[Number(m) - 1]}`;
    }

    function renderChart(entries, average) {
      const wrap = document.getElementById('sv-chart');
      const emptyEl = document.getElementById('sv-chart-empty');
      if (!entries.length) {
        wrap.innerHTML = '';
        emptyEl.style.display = 'block';
        return;
      }
      emptyEl.style.display = 'none';

      const W = Math.max(700, entries.length * 70);
      const H = 220;
      const padL = 50, padR = 20, padT = 20, padB = 30;
      const plotW = W - padL - padR;
      const plotH = H - padT - padB;

      const maxVal = Math.max(...entries.map((e) => e.total_amount), 1);
      const minVal = 0;

      const xFor = (i) => padL + (entries.length === 1 ? plotW / 2 : (i / (entries.length - 1)) * plotW);
      const yFor = (v) => padT + plotH - ((v - minVal) / (maxVal - minVal || 1)) * plotH;

      const points = entries.map((e, i) => `${xFor(i)},${yFor(e.total_amount)}`).join(' ');
      const avgY = yFor(average);

      const circles = entries.map((e, i) => `
        <circle cx="${xFor(i)}" cy="${yFor(e.total_amount)}" r="3.5" fill="var(--accent)">
          <title>${e.date}: ${formatMoney(e.total_amount)}</title>
        </circle>
      `).join('');

      const labels = entries.map((e, i) => {
        // Juda ko'p bo'lsa, faqat har 2-3 sanani ko'rsatamiz
        if (entries.length > 10 && i % Math.ceil(entries.length / 10) !== 0) return '';
        return `<text x="${xFor(i)}" y="${H - 8}" text-anchor="middle">${fmtShortDate(e.date)}</text>`;
      }).join('');

      wrap.innerHTML = `
        <svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}" style="min-width:${W}px;">
          <line x1="${padL}" y1="${padT}" x2="${padL}" y2="${H - padB}" stroke="var(--border)" stroke-width="1"/>
          <line x1="${padL}" y1="${H - padB}" x2="${W - padR}" y2="${H - padB}" stroke="var(--border)" stroke-width="1"/>
          <line x1="${padL}" y1="${avgY}" x2="${W - padR}" y2="${avgY}" stroke="var(--brand-purple-light)" stroke-width="1" stroke-dasharray="4,4"/>
          <text x="${W - padR - 5}" y="${avgY - 5}" text-anchor="end">O'rtacha</text>
          <polyline fill="none" stroke="var(--accent)" stroke-width="2.5" points="${points}"/>
          ${circles}
          ${labels}
        </svg>
      `;
    }

    async function loadSalesSummary() {
      const spot_id = document.getElementById('spot_id').value;
      const date_from = document.getElementById('date_from').value;
      const date_to = document.getElementById('date_to').value;

      const params = new URLSearchParams({ date_from, date_to });
      if (spot_id) params.set('spot_id', spot_id);

      try {
        const data = await apiFetch('/cash/sales-summary?' + params.toString());

        document.getElementById('sv-total').textContent = formatMoney(data.total);
        document.getElementById('sv-average').textContent = formatMoney(data.average);

        const trendEl = document.getElementById('sv-trend');
        if (data.previous_period.trend_percent === null) {
          trendEl.textContent = '';
        } else {
          const up = data.previous_period.trend_percent >= 0;
          trendEl.className = 'sv-trend ' + (up ? 'up' : 'down');
          trendEl.textContent = `${up ? '↑' : '↓'} ${Math.abs(data.previous_period.trend_percent)}% oldingi davrga nisbatan`;
        }

        document.getElementById('sv-max').textContent = data.max ? formatMoney(data.max.total_amount) : '—';
        document.getElementById('sv-max-date').textContent = data.max ? data.max.date : '';
        document.getElementById('sv-min').textContent = data.min ? formatMoney(data.min.total_amount) : '—';
        document.getElementById('sv-min-date').textContent = data.min ? data.min.date : '';

        renderChart(data.entries, data.average);

        const tbody = document.getElementById('sv-journal-body');
        const emptyEl = document.getElementById('sv-journal-empty');
        tbody.innerHTML = '';
        if (!data.entries.length) {
          emptyEl.style.display = 'block';
        } else {
          emptyEl.style.display = 'none';
          [...data.entries].reverse().forEach((e) => {
            const tr = document.createElement('tr');
            tr.innerHTML = `<td>${e.date}</td><td><b>${formatMoney(e.total_amount)}</b></td>`;
            tbody.appendChild(tr);
          });
        }
      } catch (e) {
        showToast('Ma\'lumot yuklashda xato: ' + e.message, true);
      }
    }

    document.getElementById('apply-btn').addEventListener('click', loadSalesSummary);

    (async function init() {
      const today = todayStr();
      const monthAgo = new Date();
      monthAgo.setDate(monthAgo.getDate() - 30);
      document.getElementById('date_from').value = monthAgo.toISOString().slice(0, 10);
      document.getElementById('date_to').value = today;

      await loadSpots();
      await loadSalesSummary();
    })();
  </script>
</body>
</html>
